<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDCE College Management System</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#17365d;
}

.login-box{
  background:white;
  width:min(420px,calc(100% - 30px));
  margin:60px auto;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 20px #0002;
  text-align:center;
}

input,select{
  box-sizing:border-box;
  padding:10px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

.login-box input{width:100%}

button{
  padding:11px 15px;
  margin:8px 5px 8px 0;
  background:#17365d;
  color:white;
  border:0;
  border-radius:6px;
  cursor:pointer;
}

button:disabled{opacity:.6;cursor:wait}

.dashboard{
  max-width:1100px;
  margin:25px auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 3px 12px #0001;
  min-width:0;
}

.card button{width:100%}

#message{color:#b00020}

table{
  width:100%;
  min-width:320px;
  border-collapse:collapse;
  background:white;
  margin-top:10px;
}

th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:left;
  overflow-wrap:anywhere;
}

th{background:#e1eaf5}

.attendance-tools{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.report-summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.present-heading{color:#15803d;margin-top:28px}
.absent-heading{color:#b91c1c;margin-top:28px}

.table-wrapper{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.report-container{
  background:#f4f7fb;
  padding:22px;
  border-radius:14px;
}

.report-title{color:#17365d}
.report-summary .card h3{font-size:18px}
.report-summary .card p{
  font-size:32px;
  font-weight:bold;
  margin:10px 0;
}

/* ==================================
   DDCE PERMANENT COLOURFUL DASHBOARD
   Keep these classes for future updates
================================== */

.dashboard-home{
  max-width:1150px;
  margin:0 auto;
}

.dashboard-header{
  position:relative;
  overflow:hidden;
  padding:30px;
  margin-bottom:25px;
  border-radius:18px;
  color:white;
  background:linear-gradient(120deg,#17365d,#285c91,#477fc0);
  box-shadow:0 8px 24px #17365d25;
}

.dashboard-header:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  right:-55px;
  top:-100px;
  background:#ffffff18;
}

.dashboard-header h1{
  margin:0 0 10px;
  font-size:30px;
  color:white;
}

.dashboard-header p{
  margin:5px 0;
  color:#eaf3ff;
}

.dashboard-header .dashboard-welcome{
  font-size:15px;
}

.dashboard-section-title{
  font-size:21px;
  color:#17365d;
  margin:25px 0 16px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.dashboard-card{
  position:relative;
  overflow:hidden;
  min-width:0;
  min-height:205px;
  padding:22px;
  border-radius:16px;
  border:1px solid #e8edf5;
  box-shadow:0 4px 14px #18365d12;
  transition:transform .2s ease,box-shadow .2s ease;
}

.dashboard-card:hover{
  transform:translateY(-4px);
  box-shadow:0 9px 22px #18365d20;
}

.dashboard-card:after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  right:-35px;
  bottom:-45px;
  background:#ffffff70;
}

.dashboard-card .dashboard-icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  font-size:27px;
  margin-bottom:15px;
  background:#ffffffb5;
}

.dashboard-card h3{
  font-size:18px;
  margin:0 0 8px;
  color:#17365d;
}

.dashboard-card p{
  font-size:14px;
  line-height:1.5;
  min-height:40px;
  margin:0 0 12px;
  color:#52647a;
}

.dashboard-card button{
  width:100%;
  margin:5px 0 0;
  border:0;
  border-radius:8px;
  font-weight:bold;
  padding:11px;
  color:white;
  position:relative;
  z-index:1;
}

.dashboard-card button:hover{
  filter:brightness(.94);
}

.dashboard-card.attendance{
  background:linear-gradient(145deg,#e8f0ff,#dce8ff);
  border-top:5px solid #2563eb;
}
.dashboard-card.attendance button{background:#2563eb}

.dashboard-card.internal{
  background:linear-gradient(145deg,#e8f8ee,#d9f2e2);
  border-top:5px solid #16834a;
}
.dashboard-card.internal button{background:#16834a}

.dashboard-card.fees{
  background:linear-gradient(145deg,#fff4e7,#ffead2);
  border-top:5px solid #d97706;
}
.dashboard-card.fees button{background:#d97706}

.dashboard-card.students{
  background:linear-gradient(145deg,#f2eaff,#e8dcff);
  border-top:5px solid #7541b8;
}
.dashboard-card.students button{background:#7541b8}

.dashboard-card.lesson{
  background:linear-gradient(145deg,#fcebf1,#f8dce8);
  border-top:5px solid #c13d70;
}
.dashboard-card.lesson button{background:#c13d70}

.dashboard-card.internship{
  background:linear-gradient(145deg,#e5f7f7,#d4eeee);
  border-top:5px solid #087f83;
}
.dashboard-card.internship button{background:#087f83}

.dashboard-card.reports{
  background:linear-gradient(145deg,#fff0f0,#ffe0e0);
  border-top:5px solid #c24141;
}
.dashboard-card.reports button{background:#c24141}

.dashboard-logout{
  margin-top:25px;
  background:#17365d;
  padding:12px 24px;
  border-radius:8px;
}

@media(max-width:600px){
  .dashboard{padding:12px;margin:10px auto}
  .login-box{margin:30px auto;padding:20px}
  .report-container{padding:12px}
  .report-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .report-summary .card{padding:12px}
  .report-summary .card h3{font-size:15px}
  .report-summary .card p{font-size:25px}
  th,td{padding:7px;font-size:13px}
  button{font-size:14px}
  h1{font-size:25px}

  .dashboard-header{
    padding:22px 18px;
    border-radius:14px;
  }

  .dashboard-header h1{font-size:24px}
  .dashboard-grid{grid-template-columns:1fr 1fr;gap:11px}
  .dashboard-card{padding:14px;min-height:195px}
  .dashboard-card h3{font-size:15px}
  .dashboard-card p{font-size:12px;min-height:48px}
  .dashboard-card .dashboard-icon{
    width:43px;
    height:43px;
    font-size:23px;
  }
}

@media(max-width:360px){
  .dashboard-grid{grid-template-columns:1fr}
}

@media print{
  body{background:white;color:black}
  .dashboard{margin:0;padding:0;max-width:none}
  button{display:none!important}
  .report-container{background:white;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  table{break-inside:auto}
  tr{break-inside:avoid}
  .table-wrapper{overflow:visible}
  table{min-width:0}
  th,td{font-size:11px;padding:6px}
  h1,h2,h3{break-after:avoid}
}

.fee-sem-4{background:linear-gradient(145deg,#fff1df,#ffdfb8);border-top:5px solid #d97706}

.fee-option-1{background:linear-gradient(145deg,#e8f0ff,#dce8ff);border-top:5px solid #2563eb}

.fee-option-2{background:linear-gradient(145deg,#e5f7ec,#ccefd9);border-top:5px solid #16834a}

.fee-option-3{background:linear-gradient(145deg,#f2eaff,#e3d3ff);border-top:5px solid #7541b8}

@media(max-width:600px){

/* FEE RECEIPT FORM */
.fee-form-wrap{background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 15px #17365d12;margin-top:18px}
.fee-form-section{margin:20px 0 10px;padding-bottom:8px;border-bottom:2px solid #e5edf7;color:#17365d}

</style>

<body>

<div class="login-box" id="loginBox">
  <h2>DDCE</h2>
  <h3>College Management System</h3>
  <p>Please Login</p>

  <form id="loginForm">
    <input id="username" type="email" placeholder="Admin Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://rsnsmehmlsogsqfbyohv.supabase.co";
const SUPABASE_KEY = "sb_publishable_QlExMkjpqD_ajwh7j4VRhA_e0H5fO-Y";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = document.getElementById("message");
  const email = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const loginButton = loginForm.querySelector("button");

  loginButton.disabled = true;
  message.style.color = "#b00020";
  message.textContent = "Logging in...";

  try {
    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if(error) throw error;

    const {data: profile, error: profileError} = await supabaseClient
      .from("profiles")
      .select("full_name, role")
      .eq("id", data.user.id)
      .single();

    if(profileError || !profile || profile.role !== "admin") {
      await supabaseClient.auth.signOut();
      throw new Error("Admin access nahi mila. Profiles table mein role check karein.");
    }

    showDashboard(profile.full_name || "DDCE Admin");

  } catch(error) {
    message.textContent = "Login failed: " + error.message;
    loginButton.disabled = false;
  }
});

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(c) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

  document.body.insertAdjacentHTML("beforeend", `

            <button id="feeReceiptButton">Open Fee Receipt</button>
          </div>

          <div class="dashboard-card students">
            <div class="dashboard-icon">👨‍🎓</div>
            <h3>Student Records</h3>
            <p>View and manage student records.</p>
            <button onclick="alert('This module is not ready yet.')">Open</button>
          </div>

          <div class="dashboard-card lesson">
            <div class="dashboard-icon">📝</div>
            <h3>Lesson Plans</h3>
            <p>Manage teaching and lesson plans.</p>
            <button onclick="alert('This module is not ready yet.')">Open</button>
          </div>

          <div class="dashboard-card internship">
            <div class="dashboard-icon">🎓</div>
            <h3>Internship Records</h3>
            <p>Manage student internship records.</p>
            <button onclick="alert('This module is not ready yet.')">Open</button>
          </div>

          <div class="dashboard-card reports">
            <div class="dashboard-icon">📊</div>
            <h3>Reports / PDF Printing</h3>
            <p>View reports and print PDF documents.</p>
            <button onclick="alert('This module is not ready yet.')">Open</button>
          </div>

        </div>

        <button class="dashboard-logout" id="logoutButton">Logout</button>

      </div>
    </div>
  `);

  document.getElementById("attendanceButton").onclick = openAttendance;
  document.getElementById("internalSubjectsButton").onclick = openInternalSubjects;
  document.getElementById("feeReceiptButton").onclick = openFeeReceipt;

  document.getElementById("logoutButton").onclick = async function() {
    await supabaseClient.auth.signOut();
    location.reload();
  };
}


/* FEE RECEIPT MODULE */

async function openFeeReceipt(selectedSemester = null) {
  const dashboard = document.querySelector(".dashboard");
  if(!dashboard) return;

  // First page: choose one of the four semesters.
  if(selectedSemester === null) {
    dashboard.innerHTML = `
      <h1 class="fee-page-title">Fee Receipt Management</h1>
      <p>DDCE College Management System</p>
      <h2 class="dashboard-section-title">Select Semester</h2>

      <div class="fee-semester-grid">
        <div class="fee-semester-card fee-sem-1">
          <h2>📘 SEM 1</h2>
          <p>Semester 1 Fee Receipt Management</p>
          <button type="button" id="feeSem1Button">Open SEM 1</button>
        </div>
        <div class="fee-semester-card fee-sem-2">
          <h2>📗 SEM 2</h2>
          <p>Semester 2 Fee Receipt Management</p>
          <button type="button" id="feeSem2Button">Open SEM 2</button>
        </div>
        <div class="fee-semester-card fee-sem-3">
          <h2>📙 SEM 3</h2>
          <p>Semester 3 Fee Receipt Management</p>
          <button type="button" id="feeSem3Button">Open SEM 3</button>
        </div>
        <div class="fee-semester-card fee-sem-4">
          <h2>📕 SEM 4</h2>
          <p>Semester 4 Fee Receipt Management</p>
          <button type="button" id="feeSem4Button">Open SEM 4</button>
        </div>
      </div>

      <button class="fee-navigation-button" id="feeReceiptDashboardButton">
        Back to Dashboard
      </button>
    `;

    document.getElementById("feeSem1Button").onclick = () => openFeeReceipt(1);

    const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
    const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

      let out = "";
      if(num >= 100) { out += ones[Math.floor(num/100)] + " Hundred "; num %= 100; }
      if(num >= 20) { out += tens[Math.floor(num/10)] + " "; num %= 10; }

        if(revisedName === null) return;
        const cleanName = revisedName.trim();
        if(!cleanName) {
          message.style.color = "#b00020";
          message.textContent = "Subject name blank nahi ho sakta.";
          return;
        }

        button.disabled = true;
        message.style.color = "#17365d";
        message.textContent = "Subject update ho raha hai...";
        const {error: updateError} = await supabaseClient
          .from("internal_subjects")
          .update({subject_name: cleanName})
          .eq("id", subjectId);

        if(updateError) {
          message.style.color = "#b00020";
          message.textContent = "Update nahi hua: " + updateError.message;
          button.disabled = false;
          return;
        }

        message.style.color = "#15803d";
        message.textContent = "Subject name update ho gaya.";
        await loadSubjects();
      });
    });
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const subjectName = nameInput.value.trim();
    if(!subjectName) {
      message.style.color = "#b00020";
      message.textContent = "Pehle subject name likhiye.";
      return;
    }

    addButton.disabled = true;
    message.style.color = "#17365d";
    message.textContent = "Subject save ho raha hai...";

    const {error: insertError} = await supabaseClient
      .from("internal_subjects")
      .insert({subject_name: subjectName});

    if(insertError) {
      message.style.color = "#b00020";
      if(insertError.code === "23505") {
        message.textContent = "Yeh subject pehle se list mein hai.";
      } else {
        message.textContent = "Subject save nahi hua: " + insertError.message;
      }
    } else {
      message.style.color = "#15803d";
      message.textContent = "Subject successfully add ho gaya.";
      nameInput.value = "";
      await loadSubjects();
    }
    addButton.disabled = false;
    nameInput.focus();
  });

  await loadSubjects();
}


/* UPDATED ATTENDANCE MODULE */

async function openAttendance(selectedSemester = 1) {
  const dashboard = document.querySelector(".dashboard");

  dashboard.innerHTML = `
    <h1>Attendance Management</h1>
    <p>DDCE College Management System</p>

    <div class="attendance-tools">
      <label for="semesterSelect"><b>Semester:</b></label>
      <select id="semesterSelect">
        <option value="1">SEM 1</option>
        <option value="3">SEM 3</option>
      </select>

      <label for="attendanceDate"><b>Date:</b></label>
      <input id="attendanceDate" type="date" required>
    </div>

    <p id="attendanceMessage">Loading students...</p>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0;">
      <div class="card" style="border-left:5px solid #2563eb;">
        <h3>Total Students</h3>
        <p id="totalCount" style="font-size:28px;font-weight:bold;">0</p>
      </div>

      <div class="card" style="border-left:5px solid #16a34a;">
        <h3>Present</h3>
        <p id="presentCount" style="font-size:28px;font-weight:bold;color:#16a34a;">0</p>
      </div>

      <div class="card" style="border-left:5px solid #dc2626;">
        <h3>Absent</h3>
        <p id="absentCount" style="font-size:28px;font-weight:bold;color:#dc2626;">0</p>
      </div>

      <div class="card" style="border-left:5px solid #7c3aed;">
        <h3>Attendance %</h3>
        <p id="attendancePercent" style="font-size:28px;font-weight:bold;color:#7c3aed;">0%</p>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Enrollment No.</th>
            <th>Student Name</th>
            <th>Attendance</th>
          </tr>
        </thead>
        <tbody id="attendanceRows"></tbody>
      </table>
    </div>

    <div id="attendanceReport" style="display:none;"></div>

    <button id="saveAttendanceButton">Save All Attendance</button>
    <button id="dashboardButton">Back to Dashboard</button>
  `;

  const dateInput = document.getElementById("attendanceDate");
  const semesterSelect = document.getElementById("semesterSelect");
  const message = document.getElementById("attendanceMessage");
  const tbody = document.getElementById("attendanceRows");
  const saveButton = document.getElementById("saveAttendanceButton");

  semesterSelect.value = String(selectedSemester);

  const today = new Date();

  dateInput.value = today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");

  document.getElementById("dashboardButton").onclick = async function() {
    const {data: authData} = await supabaseClient.auth.getUser();
    const userId = authData?.user?.id;
    let adminName = "DDCE Admin";

    if(userId) {
      const {data: profile} = await supabaseClient
        .from("profiles")
        .select("full_name")
        .eq("id", userId)
        .maybeSingle();

      if(profile?.full_name) adminName = profile.full_name;
    }

    showDashboard(adminName);
  };

  let students = [];

  function updateAttendanceSummary() {
    const total = students.length;
    let present = 0;
    let absent = 0;

    students.forEach((student, index) => {
      const statusInput = document.getElementById("status_" + index);
      if(!statusInput) return;

      if(statusInput.value === "Present") present++;
      if(statusInput.value === "Absent") absent++;
    });

    document.getElementById("totalCount").textContent = total;
    document.getElementById("presentCount").textContent = present;
    document.getElementById("absentCount").textContent = absent;

    const percentage = total > 0
      ? ((present / total) * 100).toFixed(1)
      : "0.0";

    document.getElementById("attendancePercent").textContent =
      percentage + "%";
  }

  async function loadAttendanceForDate() {
    const date = dateInput.value;
    if(!date || students.length === 0) return;

    message.textContent = "Attendance load ho rahi hai...";

    const studentIds = students.map(student => student.id);

    const {data: records, error: loadError} = await supabaseClient
      .from("attendance")
      .select("student_id, status")
      .eq("attendance_date", date)
      .in("student_id", studentIds);

    if(loadError) {
      message.textContent = "Attendance load nahi hui: " + loadError.message;
      return;
    }

    students.forEach((student, index) => {
      const record = records.find(item =>
        String(item.student_id) === String(student.id)
      );

      const statusInput = document.getElementById("status_" + index);

      if(statusInput) {
        statusInput.value = record ? record.status : "Present";
      }
    });

    updateAttendanceSummary();

    message.textContent =
      "SEM " + semesterSelect.value +
      " | Total students: " + students.length +
      " | Saved attendance: " + records.length;
  }

  async function loadSemesterStudents() {
    const semester = Number(semesterSelect.value);

    saveButton.disabled = true;
    tbody.innerHTML = "";
    students = [];

    document.getElementById("totalCount").textContent = "0";
    document.getElementById("presentCount").textContent = "0";
    document.getElementById("absentCount").textContent = "0";
    document.getElementById("attendancePercent").textContent = "0%";

    message.textContent = "SEM " + semester + " students load ho rahe hain...";

    const {data: loadedStudents, error} = await supabaseClient
      .from("students")
      .select("id, enrollment_no, student_name")
      .eq("semester", semester)
      .order("enrollment_no");

    if(error) {
      message.textContent = "Students load nahi hue: " + error.message;
      saveButton.disabled = false;
      return;
    }

    students = loadedStudents || [];

    if(students.length === 0) {
      message.textContent = "SEM " + semester + " mein koi student nahi mila.";
      saveButton.disabled = false;
      return;
    }

    tbody.innerHTML = students.map((student, index) => `
      <tr>
        <td>${escapeHTML(student.enrollment_no)}</td>
        <td>${escapeHTML(student.student_name)}</td>
        <td>
          <select id="status_${index}">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
          </select>
        </td>
      </tr>
    `).join("");

    students.forEach((student, index) => {
      document.getElementById("status_" + index)
        .addEventListener("change", updateAttendanceSummary);
    });

    await loadAttendanceForDate();
    saveButton.disabled = false;
  }

  semesterSelect.addEventListener("change", async function() {
    await loadSemesterStudents();
  });

  dateInput.addEventListener("change", loadAttendanceForDate);

  await loadSemesterStudents();

  saveButton.onclick = async function() {
    const date = dateInput.value;
    const semester = Number(semesterSelect.value);

    if(!date) {
      message.textContent = "Pehle date select karein.";
      return;
    }

    if(students.length === 0) {
      message.textContent = "Is semester mein students nahi hain.";
      return;
    }

    const records = students.map((student, index) => ({
      student_id: student.id,
      attendance_date: date,
      status: document.getElementById("status_" + index).value
    }));

    saveButton.disabled = true;
    message.textContent = "Attendance save ho rahi hai...";

    try {
      const {error: saveError} = await supabaseClient
        .from("attendance")
        .upsert(records, {
          onConflict: "student_id,attendance_date"
        });

      if(saveError) throw saveError;

      updateAttendanceSummary();

      let present = 0;
      let absent = 0;

      students.forEach((student, index) => {
        const status = document.getElementById("status_" + index).value;
        if(status === "Present") present++;
        if(status === "Absent") absent++;
      });

      const total = students.length;

      const percentage = total > 0
        ? ((present / total) * 100).toFixed(1)
        : "0.0";

      const presentStudents = students.filter((student, index) =>
        document.getElementById("status_" + index).value === "Present"
      );

      const absentStudents = students.filter((student, index) =>
        document.getElementById("status_" + index).value === "Absent"
      );

      const presentRows = presentStudents.length
        ? presentStudents.map(student =>
            "<tr><td>" + escapeHTML(student.enrollment_no) +
            "</td><td>" + escapeHTML(student.student_name) +
            "</td></tr>"
          ).join("")
        : '<tr><td colspan="2" style="text-align:center;">No present students</td></tr>';

      const absentRows = absentStudents.length
        ? absentStudents.map(student =>
            "<tr><td>" + escapeHTML(student.enrollment_no) +
            "</td><td>" + escapeHTML(student.student_name) +
            "</td></tr>"
          ).join("")
        : '<tr><td colspan="2" style="text-align:center;">No absent students</td></tr>';

      const report = document.getElementById("attendanceReport");

      const weekday = new Date(date + "T00:00:00")
        .toLocaleDateString("en-US", {weekday:"long"});

      report.innerHTML = `
        <div class="report-container">

          <h1 class="report-title">DDCE Attendance Report</h1>

          <h2>SEM ${semester}</h2>

          <p><b>Date:</b> ${escapeHTML(date)} (${escapeHTML(weekday)})</p>

          <div class="report-summary">

            <div class="card" style="border-top:5px solid #2563eb;">
              <h3>Total Students</h3>
              <p>${total}</p>
            </div>

            <div class="card" style="border-top:5px solid #16a34a;">
              <h3>Present</h3>
              <p style="color:#16a34a;">${present}</p>
            </div>

            <div class="card" style="border-top:5px solid #dc2626;">
              <h3>Absent</h3>
              <p style="color:#dc2626;">${absent}</p>
            </div>

            <div class="card" style="border-top:5px solid #7c3aed;">
              <h3>Attendance %</h3>
              <p style="color:#7c3aed;">${percentage}%</p>
            </div>

          </div>

          <h2 class="present-heading">Present Students List</h2>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Enrollment No.</th>
                  <th>Student Name</th>
                </tr>
              </thead>
              <tbody>${presentRows}</tbody>
            </table>
          </div>

          <h2 class="absent-heading">Absent Students List</h2>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Enrollment No.</th>
                  <th>Student Name</th>
                </tr>
              </thead>
              <tbody>${absentRows}</tbody>
            </table>
          </div>

          <p style="margin-top:25px;">
            <b>Semester:</b> SEM ${semester}
            &nbsp; | &nbsp;
            <b>Total:</b> ${total}
            &nbsp; | &nbsp;
            <b>Present:</b> ${present}
            &nbsp; | &nbsp;
            <b>Absent:</b> ${absent}
          </p>

          <button id="printReportButton">Print / Save as PDF</button>
          <button id="backAttendanceButton">Back to Attendance</button>

        </div>
      `;

      dashboard.innerHTML = "";
      dashboard.appendChild(report);
      report.style.display = "block";

      document.getElementById("printReportButton").onclick = function() {
        window.print();
      };

      document.getElementById("backAttendanceButton").onclick = function() {
        openAttendance(semester);
      };

    } catch(error) {
      message.textContent = "Save nahi hua: " + error.message;
      saveButton.disabled = false;
    }
  };
}
</script>
